name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vet and test in the build image
        run: docker build --target test -t netscope:test .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/testflight' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The runner shares the NAS Docker daemon; the job reaches the host's service via the docker0 gateway.
      NETSCOPE_URL: http://172.17.0.1:9110
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build -t netscope:latest .
      - name: Replace running container
        run: |
          docker rm -f netscope 2>/dev/null || true
          docker run -d --name netscope --restart unless-stopped \
            --net=host --pid=host \
            --cap-add SYS_PTRACE --security-opt apparmor=unconfined \
            netscope:latest -serve :9110
      - name: Wait for data
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$NETSCOPE_URL/healthz"; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Check the snapshot has interfaces, sockets, and rates
        run: |
          snap=$(curl -fsS "$NETSCOPE_URL/api/snapshot")
          grep -q '"interfaces"' <<< "$snap"
          grep -q '"tcp_states"' <<< "$snap"
          grep -q '"tcp_counters": true' <<< "$snap"
          metrics=$(curl -fsS "$NETSCOPE_URL/metrics")
          grep -q '^netscope_network_rx_bytes_per_second' <<< "$metrics"
