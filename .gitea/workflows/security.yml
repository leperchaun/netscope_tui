name: security

on:
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks, staticcheck, gosec, govulncheck
        run: docker build --target security -t netscope:security-${{ github.run_id }} .
      - name: Clean up
        if: always()
        run: docker rmi -f netscope:security-${{ github.run_id }} 2>/dev/null || true

  image-scan:
    runs-on: ubuntu-latest
    env:
      # Per-run tag: the runner shares the NAS Docker daemon with the deployed netscope:latest.
      IMAGE: netscope:pr-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build -t "$IMAGE" .
      - name: Trivy scan (HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Clean up
        if: always()
        run: docker rmi -f "$IMAGE" 2>/dev/null || true
